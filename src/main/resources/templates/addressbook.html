<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="'Address Book ' + ${addressBook.id}">Address Book</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 0.4rem 0.8rem; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
<h1 th:text="'Address Book #' + ${addressBook.id}">Address Book #1</h1>

<p th:if="${addressBook.buddies.isEmpty()}">This address book has no buddies yet.</p>

<table th:unless="${addressBook.buddies.isEmpty()}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone Number</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="buddy : ${addressBook.buddies}">
        <td th:text="${buddy.id}">1</td>
        <td th:text="${buddy.name}">John</td>
        <td th:text="${buddy.phoneNumber}">613-555-1234</td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/addressbooks}">All address books</a></p>
</body>
</html>
